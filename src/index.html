<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan — document camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
 
<div class="device">
  <div class="device__head">
    <h1 class="display">SCAN<span>.</span></h1>
    <p class="device__hint mono" id="headHint">v1</p>
  </div>
 
  <!-- ===== START / PERMISSION VIEW ===== -->
  <section id="view-start">
    <div class="viewport">
      <div class="start">
        <div class="start__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        </div>
        <strong class="display" style="font-size:15px;">Scan a document</strong>
        <p>Point your camera at a page on a plain surface. We'll find the edges automatically, straighten it, and let you save the crop.</p>
        <button class="btn primary" id="btnStart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Turn on camera
        </button>
      </div>
    </div>
    <p class="error mono" id="startError"></p>
  </section>
 
  <!-- ===== CAMERA / LIVE VIEW ===== -->
  <section id="view-camera" class="hidden">
    <div class="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas class="frame" id="sampleCanvas"></canvas>
      <svg class="overlay" id="overlaySvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="brackets" id="brackets"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
      <div class="badge mono" id="badge"><span class="badge__dot"></span><span id="badgeText">searching</span></div>
      <div class="autoring" id="autoring">
        <svg viewBox="0 0 36 36">
          <circle class="bg" cx="18" cy="18" r="15.5"></circle>
          <circle class="fg" id="autoringFg" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"></circle>
        </svg>
      </div>
    </div>
 
    <div class="status">
      <span>edges: <b id="statEdges">—</b></span>
      <span id="statRes" class="mono">—</span>
    </div>
 
    <div class="controls">
      <button class="iconbtn" id="btnSwitch" title="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="shutter" id="btnShutter" title="Capture"></button>
      <button class="iconbtn active" id="btnAuto" title="Auto-capture is on. Click to disable." aria-label="Auto-capture is on. Click to disable." aria-pressed="true" data-tooltip="Auto-capture is on. Click to disable.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" id="autoIcon"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 2v6l4-3"/></svg>
      </button>
    </div>
 
    <select class="deviceselect mono hidden" id="deviceSelect"></select>
    <p class="error mono" id="camError"></p>
  </section>
 
  <!-- ===== RESULT VIEW ===== -->
  <section id="view-result" class="hidden">
    <div class="viewport">
      <canvas id="resultCanvas" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"></canvas>
      <div class="badge mono" id="resultBadge"><span class="badge__dot" style="background:var(--good)"></span><span>captured</span></div>
      <button class="iconbtn result-retake" id="btnRetake" title="Retake" aria-label="Retake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.5 15"/></svg>
      </button>
    </div>
    <div class="enhance-tools">
      <div class="enhance-row" id="enhanceRow">
        <button data-mode="enhanced" class="active">Enhanced</button>
        <button data-mode="original">Original</button>
        <button data-mode="bw">B &amp; W</button>
      </div>
      <button class="iconbtn result-rotate" id="btnRotate" title="Rotate" aria-label="Rotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h12a4 4 0 0 1 4 4v1"/><path d="M7 4l-3 3 3 3"/><path d="M20 17H8a4 4 0 0 1-4-4v-1"/><path d="M17 20l3-3-3-3"/></svg>
      </button>
    </div>
    <div class="export-row">
      <label for="formatSelect">Format</label>
      <select id="formatSelect" class="formatselect">
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
      </select>
    </div>
    <div class="primary-row">
      <button class="btn" id="btnCopy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 9.5A2.5 2.5 0 0 1 11.5 7H18a2 2 0 0 1 2 2v6.5A2.5 2.5 0 0 1 17.5 18H11.5A2.5 2.5 0 0 1 9 15.5V9.5z"/><path d="M4 10a3 3 0 0 1 3-3h6.5A2.5 2.5 0 0 0 15 4.5V4a2 2 0 0 0-2-2H7a3 3 0 0 0-3 3v6a2 2 0 0 0 2 2h1"/></svg>
        Copy
      </button>
      <button class="btn" id="btnDownload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Download
      </button>
      <button class="btn btn-share primary" id="btnShare" title="Share image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share
      </button>
    </div>
  </section>
 
  <p class="foot mono">runs locally in your browser · nothing is uploaded</p>
</div>
 
<script src="https://docs.opencv.org/4.9.0/opencv.js" async></script>
<script type="module" src="app.js"></script>
</body>
</html>
