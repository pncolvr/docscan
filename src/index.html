<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Scan — document camera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="styles/base.css?v=11">
<link rel="stylesheet" href="styles/layout.css?v=11">
<link rel="stylesheet" href="styles/components.css?v=11">
</head>
<body>
 
<div class="device">
  <div class="device__head">
    <h1 class="display">SCAN<span>.</span></h1>
    <div class="device__actions">
      <label class="language-picker">
        <span class="sr-only" data-i18n="language.label">Language</span>
        <select id="languageSelect" data-i18n-aria-label="language.label" aria-label="Language">
          <option value="en" data-i18n="language.english">English</option>
          <option value="pt" data-i18n="language.portuguese">Português</option>
          <option value="es" data-i18n="language.spanish">Español</option>
        </select>
      </label>
      <button class="installbtn hidden" id="btnInstall" data-i18n-title="install.prompt" data-i18n-aria-label="install.prompt" data-i18n-tooltip="install.prompt">
          <i class="fa-solid fa-download" aria-hidden="true"></i>
        <span data-i18n="install.button">Install</span>
      </button>
    </div>
  </div>
 
  <!-- ===== START / PERMISSION VIEW ===== -->
  <section id="view-start">
    <div class="viewport">
      <div class="start">
        <div class="start__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        </div>
        <strong class="display" style="font-size:15px;" data-i18n="start.title">Scan a document</strong>
        <p data-i18n="start.description">Point your camera at a page on a plain surface. We'll find the edges automatically, straighten it, and let you save the crop.</p>
        <button class="btn primary" id="btnStart" data-i18n-tooltip="start.cameraTooltip">
          <i class="fa-solid fa-camera" aria-hidden="true"></i>
          <span data-i18n="start.camera">Turn on camera</span>
        </button>
      </div>
    </div>
    <p class="error mono" id="startError"></p>
  </section>
 
  <!-- ===== CAMERA / LIVE VIEW ===== -->
  <section id="view-camera" class="hidden">
    <div class="viewport">
      <video id="video" playsinline muted autoplay></video>
      <canvas class="frame" id="sampleCanvas"></canvas>
      <svg class="overlay" id="overlaySvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="brackets" id="brackets"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
      <div class="autoring" id="autoring">
        <svg viewBox="0 0 36 36">
          <circle class="bg" cx="18" cy="18" r="15.5"></circle>
          <circle class="fg" id="autoringFg" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"></circle>
        </svg>
      </div>
    </div>
    <div class="camera-status">
      <div class="badge mono" id="badge"><span class="badge__dot"></span><span id="badgeText" data-i18n="status.searching">searching</span></div>
    </div>
 
    <div class="controls single-camera">
      <button class="iconbtn hidden" id="btnSwitch" data-i18n-title="camera.switch" data-i18n-aria-label="camera.switch" data-i18n-tooltip="camera.switchTooltip">
        <i class="fa-solid fa-camera-rotate" aria-hidden="true"></i>
      </button>
      <button class="shutter" id="btnShutter" data-i18n-title="camera.capture" data-i18n-aria-label="camera.capture" data-i18n-tooltip="camera.captureTooltip"></button>
      <button class="iconbtn active" id="btnAuto" aria-pressed="true" data-i18n-title="camera.autoOn" data-i18n-aria-label="camera.autoOn" data-i18n-tooltip="camera.autoOn">
          <i class="fa-solid fa-arrows-rotate" id="autoIcon" aria-hidden="true"></i>
      </button>
    </div>
 
    <p class="error mono" id="camError"></p>
  </section>
 
  <!-- ===== RESULT VIEW ===== -->
  <section id="view-result" class="hidden">
    <div class="viewport">
      <div class="preview__toolbar">
        <div class="document-controls">
          <button class="iconbtn document-action" id="btnMoveUp" data-i18n-title="documents.moveUp" data-i18n-aria-label="documents.moveUp" data-i18n-tooltip="documents.moveUpTooltip">
            <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
          </button>
          <select id="documentSelect" class="document-select" data-i18n-aria-label="documents.select" aria-label="Select document"></select>
          <button class="iconbtn document-action" id="btnMoveDown" data-i18n-title="documents.moveDown" data-i18n-aria-label="documents.moveDown" data-i18n-tooltip="documents.moveDownTooltip">
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button class="iconbtn document-action" id="btnDeleteDocument" data-i18n-title="documents.delete" data-i18n-aria-label="documents.delete" data-i18n-tooltip="documents.deleteTooltip">
            <i class="fa-solid fa-trash" aria-hidden="true"></i>
          </button>
          <button class="iconbtn document-action" id="btnAddDocument" data-i18n-title="documents.add" data-i18n-aria-label="documents.add" data-i18n-tooltip="documents.addTooltip">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <canvas id="resultCanvas" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"></canvas>
      <div class="image-view-controls">
        <button class="iconbtn result-rotate" id="btnRotateCounterClockwise" data-i18n-title="result.rotateCounterClockwise" data-i18n-aria-label="result.rotateCounterClockwise" data-i18n-tooltip="result.rotateCounterClockwiseTooltip">
          <i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i>
        </button>
        <button class="iconbtn result-rotate" id="btnRotateClockwise" data-i18n-title="result.rotateClockwise" data-i18n-aria-label="result.rotateClockwise" data-i18n-tooltip="result.rotateClockwiseTooltip">
          <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i>
        </button>
        <button class="iconbtn result-zoom" id="btnZoom" data-i18n-title="result.zoom" data-i18n-aria-label="result.zoom" data-i18n-tooltip="result.zoomTooltip">
          <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="result-footer">
      <div class="quality-options">
        <span class="footer-label" data-i18n="result.quality">Quality</span>
        <div class="enhance-row" id="enhanceRow">
          <button data-mode="enhanced" class="active" data-i18n-tooltip="result.enhancedTooltip"><span data-i18n="result.enhanced">Enhanced</span></button>
          <button data-mode="original" data-i18n-tooltip="result.originalTooltip"><span data-i18n="result.original">Original</span></button>
          <button data-mode="bw" data-i18n-tooltip="result.blackWhiteTooltip"><span data-i18n="result.blackWhite">B &amp; W</span></button>
        </div>
      </div>
      <div class="export-actions">
        <div class="single-export hidden" id="singleExport">
          <label for="formatSelect" data-i18n="result.format">Format</label>
          <select id="formatSelect" class="formatselect">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="pdf">PDF</option>
          </select>
          <button class="btn" id="btnCopy" data-i18n-tooltip="result.copyTooltip"><i class="fa-solid fa-copy" aria-hidden="true"></i><span data-i18n="result.copy">Copy</span></button>
          <button class="btn" id="btnDownload" data-i18n-tooltip="result.downloadTooltip"><i class="fa-solid fa-download" aria-hidden="true"></i><span data-i18n="result.download">Download</span></button>
          <button class="btn btn-share primary hidden" id="btnShare" data-i18n-title="result.share" data-i18n-tooltip="result.shareTooltip"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span data-i18n="result.share">Share</span></button>
        </div>
        <button class="btn primary hidden" id="btnExportPdf" data-i18n-tooltip="documents.exportTooltip">
          <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
          <span data-i18n="documents.export">Export PDF</span>
        </button>
        <button class="btn primary hidden" id="btnSharePdf" data-i18n-title="documents.share" data-i18n-tooltip="documents.shareTooltip">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
          <span data-i18n="documents.share">Share PDF</span>
        </button>
      </div>
    </div>
  </section>

  <div class="zoom-view hidden" id="zoomView" aria-hidden="true">
    <div class="zoom-panel" role="dialog" aria-modal="true" aria-labelledby="zoomTitle">
      <div class="zoom-toolbar">
        <strong id="zoomTitle" data-i18n="result.zoom">Zoom</strong>
        <div class="zoom-actions">
          <button class="iconbtn zoom-control" id="btnZoomOut" data-i18n-title="result.zoomOut" data-i18n-aria-label="result.zoomOut" data-i18n-tooltip="result.zoomOutTooltip">
            <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
          </button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button class="iconbtn zoom-control" id="btnZoomIn" data-i18n-title="result.zoomIn" data-i18n-aria-label="result.zoomIn" data-i18n-tooltip="result.zoomInTooltip">
            <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
          </button>
          <button class="iconbtn zoom-control" id="btnZoomRotateCounterClockwise" data-i18n-title="result.rotateCounterClockwise" data-i18n-aria-label="result.rotateCounterClockwise" data-i18n-tooltip="result.rotateCounterClockwiseTooltip">
            <i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i>
          </button>
          <button class="iconbtn zoom-control" id="btnZoomRotateClockwise" data-i18n-title="result.rotateClockwise" data-i18n-aria-label="result.rotateClockwise" data-i18n-tooltip="result.rotateClockwiseTooltip">
            <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i>
          </button>
          <button class="iconbtn zoom-control" id="btnZoomClose" data-i18n-title="result.close" data-i18n-aria-label="result.close" data-i18n-tooltip="result.closeTooltip">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="zoom-stage" id="zoomStage">
        <canvas id="zoomCanvas"></canvas>
      </div>
    </div>
  </div>
 
  <p class="foot mono" data-i18n="footer.local">runs locally in your browser - nothing is uploaded</p>
</div>
 
<script src="https://docs.opencv.org/4.9.0/opencv.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
